name: Publish instrument packs
# Rebuilds the instrument packs (CC0 and, since D-391, CC BY) from their pinned
# upstream commits, checks every archive against
# content/instruments/manifest.json (bytes + SHA-256), publishes them as release
# assets (each pack to the release its manifest entry names, D-393), then
# downloads each one again and re-checks it. A rebuild that doesn't reproduce the
# committed hashes uploads nothing.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only, upload nothing"
        type: boolean
        default: false
      packs:
        description: "Pack ids to build and publish, space separated (empty: every pack)"
        type: string
        default: ""
permissions:
  contents: write
concurrency:
  group: publish-instruments
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      KATALYST_RELEASE_REPO: ${{ github.repository }}
      PACKS: ${{ inputs.packs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build, verify and publish
        run: |
          set -o pipefail
          args=(--build)
          [[ "${{ inputs.dry_run }}" == "true" ]] && args+=(--dry-run)
          for p in $PACKS; do args+=(--pack "$p"); done
          bash scripts/content/publish-instruments.sh "${args[@]}" 2>&1 | tee publish.log
      # D-429: the browser preview's piano, made from the built grand-piano pack and published beside it (kept if
      # already there, so the hash the suite pins never changes under it).
      - name: Piano preview for the browser
        if: ${{ !inputs.dry_run && (inputs.packs == '' || contains(inputs.packs, 'grand-piano')) }}
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          tag=bundled-grand-piano-v1
          version=$(python3 -c 'import json; print(json.load(open("tools/content/instruments.json"))["version"])')
          file=katalyst-grand-piano-preview-$version.tar.gz
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qxF "$file"; then
            echo "present   $file (kept)"
          else
            bash scripts/content/piano-preview.sh build-content/out/grand-piano build-content/preview "$version"
            gh release upload "$tag" "build-content/preview/$file"
          fi
          curl -fsSL "https://github.com/$KATALYST_RELEASE_REPO/releases/download/$tag/$file" -o /tmp/preview.tar.gz
          echo "online    $file sha256 $(sha256sum /tmp/preview.tar.gz | cut -d' ' -f1)"
      - name: Surface failure
        if: failure()
        run: grep -E "publish-instruments:|Error|error:|FAIL" publish.log | tail -20 | sed 's/^/::error::/' || true
